<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamasutra 18+ Zar va Pozitsiyalar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        .container { width: 100%; max-width: 480px; background: #1e293b; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; border: 1px solid #334155; margin-bottom: 20px; }
        header { background: linear-gradient(135deg, #e11d48, #be123c); padding: 20px; text-align: center; }
        header h1 { font-size: 24px; font-weight: 700; margin-bottom: 5px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        header p { font-size: 13px; color: #ffe4e6; }
        .content { padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .age-gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); z-index: 1000; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .age-box { background: #1e293b; border: 2px solid #e11d48; padding: 30px 20px; border-radius: 20px; text-align: center; max-width: 350px; width: 100%; }
        .age-box h2 { color: #f43f5e; margin-bottom: 15px; font-size: 22px; }
        .age-box p { font-size: 14px; color: #cbd5e1; margin-bottom: 25px; line-height: 1.5; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 20px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn-yes { background: #e11d48; color: white; flex: 1; }
        .btn-no { background: #475569; color: white; flex: 1; }
        .categories { display: flex; gap: 6px; overflow-x: auto; width: 100%; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { background: #334155; color: #94a3b8; border: none; padding: 8px 14px; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .cat-btn.active { background: #e11d48; color: white; font-weight: 600; }
        .dice-section { display: flex; flex-direction: column; align-items: center; width: 100%; margin-bottom: 20px; }
        .dice-box { width: 90px; height: 90px; background: linear-gradient(135deg, #ffffff, #e2e8f0); border-radius: 16px; display: flex; justify-content: center; align-items: center; font-size: 36px; font-weight: bold; color: #0f172a; cursor: pointer; box-shadow: 0 8px 20px rgba(225, 29, 72, 0.3); border: 2px solid #cbd5e1; transition: transform 0.3s; margin-bottom: 15px; }
        .dice-box.shake { animation: shake 0.5s ease-in-out; }
        @keyframes shake { 0% { transform: rotate(0deg); } 25% { transform: rotate(-15deg) scale(1.1); } 50% { transform: rotate(15deg) scale(1.1); } 75% { transform: rotate(-10deg); } 100% { transform: rotate(0deg); } }
        .roll-btn { background: linear-gradient(135deg, #f43f5e, #e11d48); color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4); width: 100%; max-width: 250px; }
        .result-card { background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 20px; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .position-img { width: 180px; height: 140px; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; background: #1e293b; border-radius: 12px; padding: 10px; border: 1px solid #334155; }
        .position-img svg { width: 100%; height: 100%; max-height: 120px; }
        .pos-category { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #f43f5e; font-weight: bold; margin-bottom: 5px; }
        .pos-title { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 8px; }
        .pos-desc { font-size: 13px; color: #94a3b8; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="ageGate" class="age-gate">
        <div class="age-box">
            <h2>Yosh chegarasi (18+)</h2>
            <p>Ushbu saytdagi ma'lumotlar faqat kattalar uchun mo'ljallangan. Siz 18 yoshdan kattamisiz?</p>
            <div class="btn-group">
                <button class="btn btn-yes" onclick="enterSite()">Ha, 18 yoshdaman</button>
                <button class="btn btn-no" onclick="alert('Kechirasiz, kirish taqiqlanadi.')">Yo'q</button>
            </div>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>🔥 Kamasutra Zar</h1>
            <p>Zar tashlang va pozitsiyani tanlang</p>
        </header>
        <div class="content">
            <div class="categories" id="categories">
                <button class="cat-btn active" onclick="filterCat('all')">Barchasi (40)</button>
                <button class="cat-btn" onclick="filterCat('Klassik')">Klassik</button>
                <button class="cat-btn" onclick="filterCat('Romantik')">Romantik</button>
                <button class="cat-btn" onclick="filterCat('Ehtirosli')">Ehtirosli</button>
                <button class="cat-btn" onclick="filterCat('Oral')">Oral</button>
                <button class="cat-btn" onclick="filterCat('Eksperimental')">Eksperimental</button>
            </div>
            
            <div class="dice-section">
                <div class="dice-box" id="dice" onclick="rollDice()">🎲</div>
                <button class="roll-btn" onclick="rollDice()">Zar tashlash 🎲</button>
            </div>

            <div class="result-card" id="resultCard">
                <div class="position-img" id="posImg">
                    <svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="70" cy="45" r="12" fill="#f43f5e"/><path d="M58 65 Q70 60 82 65 L90 100 L75 105 L70 85 L65 105 L50 100 Z" fill="#f43f5e"/>
                        <circle cx="130" cy="55" r="12" fill="#38bdf8"/><path d="M118 75 Q130 70 142 75 L135 110 L120 105 L125 85 L115 100 L105 95 Z" fill="#38bdf8"/>
                    </svg>
                </div>
                <div class="pos-category" id="posCat">Klassik</div>
                <div class="pos-title" id="posTitle">Misioner</div>
                <div class="pos-desc" id="posDesc">An'anaviy va qulay pozitsiya. Ko'z kontakti va yaqinlik uchun eng yaxshi tanlov.</div>
            </div>
        </div>
    </div>

    <script>
        const positions = [
            { cat: "Klassik", title: "Misioner", desc: "An'anaviy va qulay pozitsiya. Ko'z kontakti va yaqinlik uchun eng yaxshi tanlov.", svg: `<svg viewBox="0 0 200 150"><circle cx="70" cy="45" r="11" fill="#f43f5e"/><path d="M58 62 Q70 58 82 62 L88 95 L75 100 L70 80 L65 100 L52 95 Z" fill="#f43f5e"/><circle cx="130" cy="55" r="11" fill="#38bdf8"/><path d="M118 72 Q130 68 142 72 L135 105 L120 100 L125 82 L115 98 L105 92 Z" fill="#38bdf8"/></svg>` },
            { cat: "Klassik", title: "Qoshiqcha (Spoon)", desc: "Yonboshlab yotgan holda bajariladigan juda qulay va tinchlantiruvchi pozitsiya.", svg: `<svg viewBox="0 0 200 150"><circle cx="60" cy="65" r="11" fill="#f43f5e"/><path d="M50 80 Q60 75 70 80 L95 95 L85 105 L70 90 L60 105 L45 95 Z" fill="#f43f5e"/><circle cx="100" cy="65" r="11" fill="#38bdf8"/><path d="M90 80 Q100 75 110 80 L135 95 L125 105 L110 90 L100 105 L85 95 Z" fill="#38bdf8"/></svg>` },
            { cat: "Klassik", title: "Ot minish (Cowgirl)", desc: "Sherik ustida bo'lib, harakatlarni o'zi boshqaradigan ehtirosli pozitsiya.", svg: `<svg viewBox="0 0 200 150"><circle cx="100" cy="35" r="11" fill="#f43f5e"/><path d="M88 50 Q100 45 112 50 L115 85 L105 115 L95 115 L85 85 Z" fill="#f43f5e"/><circle cx="100" cy="75" r="11" fill="#38bdf8"/><path d="M80 90 Q100 85 120 90 L135 120 L110 125 L100 105 L90 125 L65 120 Z" fill="#38bdf8"/></svg>` },
            { cat: "Romantik", title: "Lotus gullari", desc: "Bir-biriga yuzma-uz o'tirib quchoqlashgan holdagi yaqinlik.", svg: `<svg viewBox="0 0 200 150"><circle cx="85" cy="50" r="11" fill="#f43f5e"/><path d="M73 65 Q85 60 97 65 L95 100 L85 110 L75 100 Z" fill="#f43f5e"/><circle cx="115" cy="50" r="11" fill="#38bdf8"/><path d="M103 65 Q115 60 127 65 L125 100 L115 110 L105 100 Z" fill="#38bdf8"/></svg>` },
            { cat: "Romantik", title: "Tik turib quchoqlashish", desc: "Devorga tayanib, tik turgan holdagi romantik va shiddatli holat.", svg: `<svg viewBox="0 0 200 150"><circle cx="90" cy="40" r="11" fill="#f43f5e"/><path d="M78 55 Q90 50 102 55 L98 100 L90 130 L80 130 Z" fill="#f43f5e"/><circle cx="120" cy="50" r="11" fill="#38bdf8"/><path d="M108 65 Q120 60 132 65 L128 105 L120 130 L110 130 Z" fill="#38bdf8"/></svg>` },
            { cat: "Ehtirosli", title: "It uslubi (Doggy Style)", desc: "Orqa tomondan kirishishga mo'ljallangan eng chuqur va ehtirosli pozitsiya.", svg: `<svg viewBox="0 0 200 150"><circle cx="65" cy="60" r="11" fill="#f43f5e"/><path d="M53 75 Q65 70 77 75 L110 85 L100 110 L80 100 L70 115 L50 105 Z" fill="#f43f5e"/><circle cx="130" cy="50" r="11" fill="#38bdf8"/><path d="M118 65 Q130 60 142 65 L135 100 L120 95 L125 80 L115 90 Z" fill="#38bdf8"/></svg>` },
            { cat: "Oral", title: "Klassik Oral", desc: "Yotgan holatdagi e'tibor va zavq ulashuvchi nafis jarayon.", svg: `<svg viewBox="0 0 200 150"><circle cx="75" cy="70" r="11" fill="#f43f5e"/><path d="M63 85 Q75 80 87 85 L120 90 L110 105 L90 100 Z" fill="#f43f5e"/><circle cx="135" cy="60" r="11" fill="#38bdf8"/><path d="M123 75 Q135 70 147 75 L140 105 L130 100 Z" fill="#38bdf8"/></svg>` },
            { cat: "Oral", title: "O'tirib bajariladigan oral", desc: "Qulay o'rindiqda yoki divanda o'tirgan holda erkalash.", svg: `<svg viewBox="0 0 200 150"><circle cx="90" cy="50" r="11" fill="#f43f5e"/><path d="M78 65 Q90 60 102 65 L100 100 L85 110 L80 90 Z" fill="#f43f5e"/><circle cx="125" cy="60" r="11" fill="#38bdf8"/><path d="M113 75 Q125 70 137 75 L130 110 L115 105 Z" fill="#38bdf8"/></svg>` },
            { cat: "Eksperimental", title: "Ko'prik (Bridge)", desc: "Maxsus egiluvchanlik va yangi ta'mlarni beruvchi noodatiy pozitsiya.", svg: `<svg viewBox="0 0 200 150"><circle cx="70" cy="60" r="11" fill="#f43f5e"/><path d="M58 75 Q70 70 82 75 L110 90 L95 105 L70 95 Z" fill="#f43f5e"/><circle cx="130" cy="50" r="11" fill="#38bdf8"/><path d="M118 65 Q130 60 142 65 L135 100 L120 95 Z" fill="#f43f5e"/></svg>` },
            { cat: "Eksperimental", title: "Qo'shaloq tebranish", desc: "Harakatlarni muvofiqlashtirgan holdagi o'ta qizg'in tajriba.", svg: `<svg viewBox="0 0 200 150"><circle cx="80" cy="45" r="11" fill="#f43f5e"/><path d="M68 60 Q80 55 92 60 L100 95 L85 105 L75 85 Z" fill="#f43f5e"/><circle cx="120" cy="65" r="11" fill="#38bdf8"/><path d="M108 80 Q120 75 132 80 L125 110 L110 105 L115 90 Z" fill="#38bdf8"/></svg>` }
        ];

        let currentFiltered = [...positions];

        function enterSite() { document.getElementById('ageGate').style.display = 'none'; }

        function filterCat(cat) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            if(cat === 'all') currentFiltered = [...positions];
            else currentFiltered = positions.filter(p => p.cat === cat);
            rollDice();
        }

        function rollDice() {
            const dice = document.getElementById('dice');
            dice.classList.add('shake');
            setTimeout(() => dice.classList.remove('shake'), 500);

            const randomPos = currentFiltered[Math.floor(Math.random() * currentFiltered.length)];
            const diceNums = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            dice.innerText = diceNums[Math.floor(Math.random() * diceNums.length)];

            document.getElementById('posImg').innerHTML = randomPos.svg;
            document.getElementById('posCat').innerText = randomPos.cat;
            document.getElementById('posTitle').innerText = randomPos.title;
            document.getElementById('posDesc').innerText = randomPos.desc;
        }
    </script>
</body>
</html>
